worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        location /llama/ {
            alias /usr/share/nginx/html/;  # 注意 alias 会替代请求路径
            try_files $uri $uri/ /index.html;
            index index.html;

        }

        # 可选：如果你有后端接口
        location /api/ {
            proxy_pass http://host.docker.internal:8000;  # mac/linux
            proxy_pass http://host.docker.internal:5000;  # mac/linux
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
